<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" stroke="#6366f1" stroke-width="4"/>
  
  <!-- 图表图标 -->
  <g transform="translate(32, 32)">
    <!-- 柱状图 -->
    <rect x="8" y="40" width="8" height="24" fill="#ffffff" opacity="0.9"/>
    <rect x="20" y="32" width="8" height="32" fill="#ffffff" opacity="0.9"/>
    <rect x="32" y="24" width="8" height="40" fill="#ffffff" opacity="0.9"/>
    <rect x="44" y="36" width="8" height="28" fill="#ffffff" opacity="0.9"/>
    <rect x="56" y="28" width="8" height="36" fill="#ffffff" opacity="0.9"/>
    
    <!-- 折线图 -->
    <path d="M8 48 L20 40 L32 32 L44 44 L56 36 L68 28" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 数据点 -->
    <circle cx="8" cy="48" r="2" fill="#ffffff"/>
    <circle cx="20" cy="40" r="2" fill="#ffffff"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
    <circle cx="44" cy="44" r="2" fill="#ffffff"/>
    <circle cx="56" cy="36" r="2" fill="#ffffff"/>
    <circle cx="68" cy="28" r="2" fill="#ffffff"/>
  </g>
  
  <!-- 放大镜图标 -->
  <g transform="translate(80, 20)">
    <circle cx="16" cy="16" r="12" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M24 24 L32 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 代码标签图标 -->
  <g transform="translate(20, 80)">
    <path d="M8 8 L16 16 L8 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 8 L16 16 L24 24" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg> 