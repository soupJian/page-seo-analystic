<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单测试页面</title>
  <meta name="description" content="测试结构化数据渲染">

  <!-- 产品结构化数据 -->
  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "测试产品",
        "description": "这是一个测试产品",
        "brand": {
            "@type": "Brand",
            "name": "测试品牌"
        },
        "offers": {
            "@type": "Offer",
            "price": "99.99",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
        }
    }
    </script>

  <!-- 导航结构化数据 -->
  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
            {
                "@type": "ListItem",
                "position": 1,
                "name": "首页",
                "item": "https://example.com"
            },
            {
                "@type": "ListItem",
                "position": 2,
                "name": "产品",
                "item": "https://example.com/products"
            }
        ]
    }
    </script>
</head>

<body>
  <h1>简单测试页面</h1>
  <p>这个页面用于测试结构化数据的渲染功能。</p>
  <p>请打开Chrome扩展来查看结构化数据分析结果。</p>
</body>

</html>
