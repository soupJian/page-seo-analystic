    <h3>结构化数据测试</h3>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebPage",
            "name": "SEO分析工具测试页面",
            "description": "这是一个用于测试SEO分析工具的页面",
            "url": "https://example.com/test"
        }
        </script>
  </div>

  <script>
    // 模拟Chrome扩展环境
    if (typeof chrome === 'undefined') {
      window.chrome = {
        runtime: {
          sendMessage: function (message, callback) {
            console.log('模拟发送消息:', message);
            if (callback) {
              setTimeout(() => {
                callback({ success: true, data: 'mock response' });
              }, 100);
            }
          },
          onMessage: {
            addListener: function (callback) {
              console.log('模拟添加消息监听器');
              window.__mockMessageListener = callback;
            }
          }
        }
      };
    }

    function checkContentScript () {
      const statusDiv = document.getElementById('contentScriptStatus');

      // 检查是否已初始化
      if (window.__seoAnalyzerInitialized) {
        statusDiv.className = 'status success';
        statusDiv.innerHTML = '✅ Content Script 已成功初始化<br>分析器实例: ' + (window.__seoAnalyzer ? '已创建' : '未创建');
      } else {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = '❌ Content Script 未初始化';
      }
    }

    function runAnalysis () {
      const statusDiv = document.getElementById('analysisStatus');
      const resultsDiv = document.getElementById('analysisResults');

      statusDiv.className = 'status info';
      statusDiv.innerHTML = '🔄 正在分析页面...';

      if (window.__seoAnalyzer) {
        try {
          // 直接调用分析方法
          window.__seoAnalyzer.analyzePage().then(data => {
            statusDiv.className = 'status success';
            statusDiv.innerHTML = '✅ 页面分析完成！';

            // 显示分析结果
            resultsDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
          }).catch(error => {
            statusDiv.className = 'status error';
            statusDiv.innerHTML = '❌ 分析失败: ' + error.message;
            resultsDiv.innerHTML = '<div class="error">分析失败: ' + error.message + '</div>';
          });
        } catch (error) {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = '❌ 分析失败: ' + error.message;
          resultsDiv.innerHTML = '<div class="error">分析失败: ' + error.message + '</div>';
        }
      } else {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = '❌ 分析器未初始化';
      }
    }

    function clearResults () {
      document.getElementById('analysisResults').innerHTML = '';
      document.getElementById('analysisStatus').className = 'status info';
      document.getElementById('analysisStatus').innerHTML = '点击按钮开始分析页面...';
    }

    // 页面加载完成后检查状态
    window.addEventListener('load', function () {
      setTimeout(checkContentScript, 500);
    });
  </script>

  <!-- 加载构建后的content.js -->
  <script src="dist/content.js"></script>
</body>
