<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO分析侧边栏</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>

<body class="bg-gray-50 font-sans">
  <div class="h-full overflow-y-auto">
    <!-- 头部 -->
    <div class="sticky top-0 bg-white shadow-sm border-b border-gray-200 p-4 z-10">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800 flex items-center">
          <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
            </path>
          </svg>
          SEO分析报告
        </h1>
        <button id="reanalyzeBtn" class="btn-secondary text-sm">重新分析</button>
      </div>
    </div>

    <!-- 加载状态 -->
    <div id="loadingStatus" class="p-4 text-center hidden">
      <div class="flex items-center justify-center">
        <div class="loading-spinner mr-2"></div>
        <span class="text-gray-600">正在分析页面...</span>
      </div>
    </div>

    <!-- URL变化通知 -->
    <div id="urlChangeNotice" class="p-4 bg-yellow-50 border-l-4 border-yellow-400 hidden">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-yellow-800 font-medium">URL已变化</p>
          <p class="text-yellow-700 text-sm">点击重新分析当前页面</p>
        </div>
        <button id="reanalyzeAfterUrlChange" class="btn-primary text-sm">重新分析</button>
      </div>
    </div>

    <!-- 错误状态 -->
    <div id="errorStatus" class="p-4 bg-red-50 border-l-4 border-red-400 hidden">
      <div class="flex items-center">
        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"></path>
        </svg>
        <span class="text-red-800" id="errorMessage">分析失败</span>
      </div>
    </div>

    <!-- 内容区域 -->
    <div id="contentArea" class="p-4 space-y-6">
      <!-- 页面基本信息 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          页面基本信息
        </h2>
        <div id="basicInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- Meta信息 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
            </path>
          </svg>
          Meta信息
        </h2>
        <div id="metaInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- Open Graph信息 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z">
            </path>
          </svg>
          Open Graph信息
        </h2>
        <div id="openGraphInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 标题结构 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16">
            </path>
          </svg>
          标题结构
        </h2>
        <div id="headingStructure" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 图片信息 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
            </path>
          </svg>
          图片信息
        </h2>
        <div id="imageInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 链接信息 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
            </path>
          </svg>
          链接信息
        </h2>
        <div id="linksInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 结构化数据 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
            </path>
          </svg>
          结构化数据 (JSON-LD)
        </h2>
        <div id="structuredDataInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 分析工具检测 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
            </path>
          </svg>
          分析工具检测
        </h2>
        <div id="analyticsInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 拼写检查 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
            </path>
          </svg>
          拼写检查
        </h2>
        <div id="spellCheckInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- SEO建议 -->
      <div class="seo-card">
        <h2 class="seo-title">
          <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
            </path>
          </svg>
          SEO优化建议
        </h2>
        <div id="recommendationsInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="sidebar.ts" type="module"></script>
</body>

</html>
