<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面分析工具</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    /* 确保侧边栏占满整个高度 */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar-root {
      height: 100vh;
      width: 100%;
    }

    /* 自定义滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>

<body>
  <div id="sidebar-root"></div>
  <script type="module" src="./sidebar.tsx"></script>
</body>

</html>
