<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO分析侧边栏</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>

<body class="bg-gray-50 font-sans">
  <div class="h-full overflow-y-auto">
    <!-- 头部 -->
    <div class="sticky top-0 bg-white shadow-sm border-b border-gray-200 p-4 z-10">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">SEO分析报告</h1>
        <button id="closeSidebar" class="text-gray-500 hover:text-gray-700 text-xl font-bold">×</button>
      </div>
    </div>

    <!-- 内容区域 -->
    <div class="p-4 space-y-6">
      <!-- 页面基本信息 -->
      <div class="seo-card">
        <h2 class="seo-title">页面基本信息</h2>
        <div id="basicInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- Meta信息 -->
      <div class="seo-card">
        <h2 class="seo-title">Meta信息</h2>
        <div id="metaInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- Open Graph信息 -->
      <div class="seo-card">
        <h2 class="seo-title">Open Graph信息</h2>
        <div id="openGraphInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 标题结构 -->
      <div class="seo-card">
        <h2 class="seo-title">标题结构</h2>
        <div id="headingStructure" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 图片信息 -->
      <div class="seo-card">
        <h2 class="seo-title">图片信息</h2>
        <div id="imageInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 链接信息 -->
      <div class="seo-card">
        <h2 class="seo-title">链接信息</h2>
        <div id="linksInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 结构化数据 -->
      <div class="seo-card">
        <h2 class="seo-title">结构化数据 (LD+JSON)</h2>
        <div id="structuredDataInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- 分析工具检测 -->
      <div class="seo-card">
        <h2 class="seo-title">分析工具检测</h2>
        <div id="analyticsInfo" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>

      <!-- SEO建议 -->
      <div class="seo-card">
        <h2 class="seo-title">SEO优化建议</h2>
        <div id="recommendations" class="space-y-2">
          <div class="seo-content">正在分析...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="sidebar.js" type="module"></script>
</body>

</html>
